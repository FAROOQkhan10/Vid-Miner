<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="x-icon" href="/apple-touch-icon.png">
    <title>Vid Miner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/result.css?v=5">
    <script src="/result.js?v=4" type="module"></script>
</head>
<body>

<div class="page-head">
    <a href="/" class="Back">&#8592; Go back</a>
    <form action="/video" method="post" class="mini-search">
        <input type="text" name="videoUrl" required placeholder="Paste another YouTube URL" aria-label="YouTube video URL"/>
        <button type="submit">Dig</button>
    </form>
</div>

<div th:if="${response.items.size() > 0}">
    <div class="result-count-row">
        <span class="result-count" th:text="|${response.items.size()} ${response.items.size() == 1 ? 'item' : 'items'} dug up successfully|">3 items dug up successfully</span>
    </div>

    <div class="card-container">
        <div th:each="item, iter : ${response.items}" class="card">

            <a class="thumb-wrap" th:href="${item.snippet.thumbnails.maxres.url}" download="${item.snippet.title}.jpg" aria-label="Download thumbnail">
                <img th:src="${item.snippet.thumbnails.maxres.url}" alt="Thumbnail" class="card-img"/>
                <span class="thumb-overlay">
                    <ion-icon name="download-outline"></ion-icon>
                </span>
            </a>

            <div class="card-body">
                <h5 class="card__title" th:text="${item.snippet.title}"></h5>
                <p class="card__channel">
                    <ion-icon name="person-circle-outline"></ion-icon>
                    <span th:text="${item.snippet.channelTitle}"></span>
                </p>
                <p class="desc" th:text="${item.snippet.description}"></p>

                <button type="button" class="copy" data-copy=".desc">
                    <ion-icon name="copy-outline" class="copy-icon"></ion-icon>
                    <span class="copy-label">Copy description</span>
                </button>

                <div class="card__subtitle">
                    <p class="stat-item">
                        <ion-icon name="eye-outline" class="stat-icon"></ion-icon>
                        <span th:text="${item.statistics.viewCount} "></span>
                    </p>
                    <p class="stat-item">
                        <ion-icon name="thumbs-up-outline" class="stat-icon"></ion-icon>
                        <span th:text="${item.statistics.likeCount} "></span>
                    </p>
                    <p class="stat-item">
                        <ion-icon name="chatbubble-ellipses-outline" class="stat-icon"></ion-icon>
                        <span th:text="${item.statistics.commentCount} "></span>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:if="${response == null}" class="no-results">
    <ion-icon name="warning-outline" style="font-size: 40px; color: var(--pink);"></ion-icon>
    <p>Something cracked wrong on our end. Try that link again.</p>
</div>

<div th:if="${response.items.size() == 0}" class="no-results">
    <div th:replace="404 :: content"></div>
</div>

<div class="processing-overlay" id="processingOverlay" role="status" aria-live="polite">
    <div class="processing-box">
        <div class="spinner" aria-hidden="true"></div>
        <p id="processingText">Digging up the new link&hellip;</p>
    </div>
</div>

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
